parameters:
    app.queue_database_path: '%kernel.project_dir%/data/orchestrator.sqlite'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../../../src/'
        exclude:
            - '../../../src/DependencyInjection/'
            - '../../../src/Entity/'
            - '../../../src/Kernel.php'
            - '../../../src/Service/OrchestratorQueueClient.php'

    App\Service\QueueDatabase:
        arguments:
            $databasePath: '%app.queue_database_path%'

    App\Service\QueueManager:
        public: true

    Ezs\Web\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Module/Coordination/ExclusiveLease.php'
            - '../src/Module/Coordination/Messenger/QueueJobReference.php'
            - '../src/Module/Coordination/ExpiredLeaseSweep.php'
            - '../src/Module/Coordination/ExecutorStopAttestor.php'
            - '../src/Module/Coordination/ExecutorOwnershipRegistry.php'
            - '../src/Module/Coordination/SyntheticCpuQueueRunner.php'
            - '../src/Module/Coordination/SyntheticChildProcessRunner.php'
            - '../src/Module/Coordination/WindowsExecutorObservation.php'

when@test:
    services:
        App\Service\QueueManager:
            autowire: true
            public: true
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        users_in_memory:
            memory:
                users:
                    operator:
                        password: '%env(default::ORCHESTRATOR_OPERATOR_PASSWORD_HASH)%'
                        roles: ['ROLE_ORCHESTRATOR_OPERATOR']
    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        hardware_agent:
            pattern: ^/internal/hardware/inventory$
            stateless: true
            custom_authenticators:
                - Ezs\Web\Module\Hardware\Security\HardwareAgentAuthenticator
        main:
            lazy: true
            provider: users_in_memory
            http_basic:
                realm: 'EZStudio Orchestrator'
    access_control:
        - { path: ^/internal/hardware/inventory$, roles: ROLE_HARDWARE_READ }
        - { path: ^/api/queue, ips: [127.0.0.1, '::1'], roles: PUBLIC_ACCESS }
        - { path: ^/jobs, ips: [127.0.0.1, '::1'], roles: PUBLIC_ACCESS }
        - { path: ^/jobs, roles: ROLE_ORCHESTRATOR_OPERATOR }
        - { path: ^/, ips: [127.0.0.1, '::1'], roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ORCHESTRATOR_OPERATOR }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'plaintext'
        providers:
            users_in_memory:
                memory:
                    users:
                        operator: { password: 'operator_pass', roles: ['ROLE_ORCHESTRATOR_OPERATOR'] }
                        viewer: { password: 'viewer_pass', roles: ['ROLE_USER'] }

doctrine_migrations:
    migrations_paths:
        'EZSLabMigrations': '%ezs_lab.app_dir%/migrations'
    storage:
        table_storage:
            table_name: ezs_lab_migration_versions
    enable_profiler: false
    services:
        'Doctrine\Migrations\Provider\SchemaDiffProvider': 'EZSLab\Service\ExplicitMigrationSchemaProvider'

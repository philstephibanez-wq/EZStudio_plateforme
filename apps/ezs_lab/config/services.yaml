parameters:
    app.database_path: '%kernel.project_dir%/apps/ezs_lab/data/benchmark.sqlite'
    ezs_lab.app_dir: '%kernel.project_dir%/apps/ezs_lab'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $databasePath: '%app.database_path%'

    EZSLab\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    EZSLab\Service\BenchmarkLauncher:
        arguments:
            $database: '@EZSLab\Service\Database'
            $projectDir: '%ezs_lab.app_dir%'
            $pythonExecutable: 'H:\Python\pythoncore-3.14-64\python.exe'
            $dependencyRoot: '%kernel.project_dir%/var/runtime/deps'
            $keepUploads: true

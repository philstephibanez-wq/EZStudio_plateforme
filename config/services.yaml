parameters:
    app.queue_database_path: '%kernel.project_dir%/data/databases/EZS_Orchestrator.sqlite'
    app.lab_database_path: '%kernel.project_dir%/data/databases/EZS_Lab.sqlite'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Service/OrchestratorQueueClient.php'

    App\Service\QueueManager:
        public: true

    App\Service\QueueDatabase:
        arguments:
            $databasePath: '%app.queue_database_path%'

when@test:
    parameters:
        app.queue_database_path: '%kernel.project_dir%/var/orchestrator_test.sqlite'
    services:
        App\Service\QueueManager:
            public: true
